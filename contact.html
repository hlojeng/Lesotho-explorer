<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lsotho Explorer | Contact</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"> 
	
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body> 

	<header class="header">
		<a href="index.html" class="logo">
			<span class="logo-icon">🏔️</span>
			<span>Lesotho Explore</span>
		</a>

		<nav class="navbar">
			<a href="index.html">Home</a>
			<a href="destination.html">Destination</a>
			<a href="about.html">About</a>
			<a href="contact.html">Contact</a>
		</nav>
	</header>

	<main class="contact-page">

		<div class="section-heading">
			<p class="subtitle">WE WOULD LOVE TO HEAR FROM YOU</p>

			<h1>Contact US</h1>

			<p>Have a question? Send us a message</p> 
		</div>

		<form class="contact-form" onsubmit="validationForm(event)">
			<label for="name">Full Name</label>
			<input type="text" id="name" name="name" placeholder="Enter your name" required>

			<label for="email">Email Address</label>
			<input type="email" id="email" name="email" placeholder="Enter your email" required>
			
			<label for="message">Your Message</label>
			<textarea id="message" name="message" 
			           rows="6" placeholder="Write your message" required>
			           	
			</textarea>

			<button type="submit" class="btn">Submit</button>
			<p id="formMessage" aria-live="polite"></p>
			
		</form> 
		
	</main> 

	<footer class="footer">
		<h2>Lesotho Explorer</h2>
		<p>Discover. Explore. Experience Lesotho</p>
		<p>&copy;2026 Lesotho Explorer. All rights reserved.</p> 
	</footer>

	<script
	src="https://cdn.jsdelivr.net/npm/bootsrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script> 

</body>
</html>
